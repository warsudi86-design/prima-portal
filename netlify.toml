# netlify.toml — taruh file ini di root project PORTAL HUB (portalhub-prima)
# Fungsinya: mem-proxy tiap path modul ke site Netlify aslinya, supaya saat
# domain custom dipasang di site portalhub-prima, semua modul tetap tampil
# di bawah domain yang sama (tidak lompat ke *.netlify.app lain).
#
# Syarat: site portalhub-prima dan ke-17 site modul di bawah ini harus
# berada di TEAM Netlify yang sama.

[[redirects]]
  from = "/nonwarranty-estimasi/*"
  to = "https://nonwarranty-estimasi.netlify.app/:splat"
  status = 200
  force = true

